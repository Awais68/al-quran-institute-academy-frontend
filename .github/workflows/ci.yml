name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # next build runs its own type check and lint pass, but the two steps
      # above report first so a failure points at the actual cause.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://al-quran-institute-online-backend.onrender.com
          NEXT_PUBLIC_SOCKET_URL: https://al-quran-institute-online-backend.onrender.com
